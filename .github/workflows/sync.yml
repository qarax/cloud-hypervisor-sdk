name: Sync with Cloud Hypervisor

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *" # daily at 6am UTC
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write # push the regenerated SDK, tags and releases
  actions: write # keep this workflow enabled (see below)
  issues: write # report failed syncs

concurrency:
  group: sync
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  sync:
    name: Check and sync with latest Cloud Hypervisor release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # GitHub disables scheduled workflows after 60 days without a commit, and
      # this job only commits when Cloud Hypervisor releases. Re-enabling the
      # workflow resets that timer.
      - name: Keep this workflow enabled
        run: gh api -X PUT "repos/${GH_REPO}/actions/workflows/sync.yml/enable"

      - name: Check for a new Cloud Hypervisor release
        id: release
        run: |
          TAG=$(gh release view --repo cloud-hypervisor/cloud-hypervisor --json tagName --jq .tagName)
          if [ -z "$TAG" ]; then
            echo "ERROR: Could not fetch latest Cloud Hypervisor release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          CURRENT=$(cat .cloud-hypervisor-version 2>/dev/null || echo none)
          SDK_TAG="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "Latest Cloud Hypervisor release: $TAG, SDK tracks: $CURRENT ($SDK_TAG)"

          # Also covers a previous run that synced but failed before tagging.
          if [ "$TAG" = "$CURRENT" ] && git rev-parse -q --verify "refs/tags/$SDK_TAG" >/dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.release.outputs.needed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Regenerate SDK
        if: steps.release.outputs.needed == 'true'
        env:
          CH_TAG: ${{ steps.release.outputs.tag }}
        run: ./regenerate.sh

      # The push below doesn't trigger CI (pushes made with GITHUB_TOKEN never
      # start workflows), so run the same checks here before releasing.
      - name: Lint and test
        if: steps.release.outputs.needed == 'true'
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Commit, tag and release
        if: steps.release.outputs.needed == 'true'
        env:
          CH_TAG: ${{ steps.release.outputs.tag }}
        run: |
          SDK_TAG="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Generated code is unchanged, tagging the current commit."
          else
            git commit -m "chore: sync with Cloud Hypervisor ${CH_TAG}"
            git push origin HEAD:main
          fi

          git tag -a "$SDK_TAG" -m "Release $SDK_TAG (Cloud Hypervisor ${CH_TAG})"
          git push origin "$SDK_TAG"

          gh release create "$SDK_TAG" --title "$SDK_TAG" --verify-tag --generate-notes --notes "$(cat <<EOF
          ## cloud-hypervisor-sdk ${SDK_TAG}

          Automatically synced with **Cloud Hypervisor ${CH_TAG}**.

          \`\`\`toml
          cloud-hypervisor-sdk = { git = "https://github.com/${GH_REPO}", tag = "${SDK_TAG}" }
          \`\`\`
          EOF
          )"

      - name: Close resolved failure issues
        if: success() && steps.release.outputs.needed == 'true'
        run: |
          gh issue list --state open --search "Sync with Cloud Hypervisor in:title" --json number,title \
            --jq '.[] | select(.title | test("^Sync with Cloud Hypervisor .* failed$")) | .number' |
            while read -r n; do
              gh issue close "$n" --comment "Resolved: ${{ github.server_url }}/${GH_REPO}/actions/runs/${{ github.run_id }}"
            done

      # A failed sync used to go unnoticed until the schedule was disabled.
      # Open one issue per failing release (later failures don't add noise).
      - name: Report failure
        if: failure()
        env:
          CH_TAG: ${{ steps.release.outputs.tag }}
        run: |
          TITLE="Sync with Cloud Hypervisor ${CH_TAG:-release} failed"
          RUN_URL="${{ github.server_url }}/${GH_REPO}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already tracks this failure."
            exit 0
          fi
          gh issue create --title "$TITLE" --body "$(cat <<EOF
          The scheduled sync failed: $RUN_URL

          To fix it locally:

          \`\`\`sh
          CH_TAG=${CH_TAG} ./regenerate.sh
          cargo clippy --all-targets -- -D warnings && cargo test
          \`\`\`

          Update hand-written code (\`src/machine.rs\`, \`examples/\`) for any API changes and merge the result to \`main\`. The next sync run then tags and releases the SDK and closes this issue.
          EOF
          )"
